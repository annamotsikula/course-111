<div class="content">
  <div class="card">
    <div class="card-header">Chat</div>
    <div class="card-body">
      <ul class="chat-list" #messageList>
        @for (chat of chatHistory ; track $index) {
            <li [ngClass]="chat.type === 'INCOMING' ? 'in' : 'out'">
                <div class="chat-img">
                  <img alt="Avtar" [src]="img" />
                </div>
                <div class="chat-body">
                  <div class="chat-message">
                    <h5>{{chat.type === 'INCOMING' ? name : 'You'}}</h5>
                    <p>{{chat.text}}</p>
                  </div>
                </div>
            </li>
        } @empty {
            <p class="empty">Conversation has not started</p>
        }
      </ul>
      <div class="form-outline p-2">
        <input
          class="form-control bg-body-tertiary"
          placeholder="Type your message here..."
          rows="4"
          [(ngModel)]="outgoingMessage"
          (keyup.enter)="sendMessage()"
        >
      </div>
    </div>
  </div>
</div>
