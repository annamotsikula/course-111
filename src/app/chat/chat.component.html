<div class="content">
  <div class="card">
    <div class="card-header">Chat</div>
    <div class="card-body height3">
      <ul class="chat-list">
        @for (chat of chatHistory ; track $index) {
            <li [ngClass]="chat.type === 'INCOMING' ? 'in' : 'out'">
                <div class="chat-img">
                  <img alt="Avtar" [src]="img" />
                </div>
                <div class="chat-body">
                  <div class="chat-message">
                    <h5>{{chat.type === 'INCOMING' ? name : 'You'}}</h5>
                    <p>{{chat.text}}</p>
                  </div>
                </div>
            </li>
        } @empty {
            Conversation has not started
        }
      </ul>
    </div>
    <div class="form-outline p-2">
      <textarea
        class="form-control bg-body-tertiary"
        placeholder="Type your message here..."
        rows="4"
        [(ngModel)]="outgoingMessage"
        (keyup.enter)="sendMessage()"
      > </textarea>
    </div>
  </div>
</div>
