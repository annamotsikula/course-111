<main class="form-signin w-25 m-auto">
    <form [formGroup]="authForm" (submit)="onSubmit()">
      <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
      <div class="form-floating">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" formControlName="email" autocomplete="email">
        <label for="floatingInput">Email address</label>
      </div>
      @if(authForm.controls.email.touched && authForm.controls.email.invalid) {
        <div class="error">
          @if(authForm.controls.email.errors?.['required']) {
          <span>This field is required</span>
          } @if(authForm.controls.email.errors?.['email']) {
          <span>This format is not valid</span>
          }
        </div>
      }
      <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" formControlName="password" autocomplete="current-password">
        <label for="floatingPassword">Password</label>
      </div>
  
      <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault" formControlName="rememberUser">
        <label class="form-check-label" for="checkDefault">
          Remember me
        </label>
      </div>
      <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
      <p class="mt-5 mb-3 text-body-secondary">© 2017–2025</p>
    </form>
  </main>
